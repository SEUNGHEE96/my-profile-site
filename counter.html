<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-12 max-w-md w-full">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">카운터</h1>

        <!-- 카운트 표시 -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-8 mb-8 text-center">
            <p class="text-blue-100 text-sm font-semibold mb-2">현재 카운트</p>
            <p id="counter" class="text-6xl font-bold text-white">0</p>
        </div>

        <!-- 버튼 그룹 -->
        <div class="space-y-4">
            <!-- 증가 버튼 -->
            <button
                onclick="increaseCounter()"
                class="w-full bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg transition duration-200 transform hover:scale-105 active:scale-95 text-xl"
            >
                + 증가
            </button>

            <!-- 감소 버튼 -->
            <button
                onclick="decreaseCounter()"
                class="w-full bg-blue-400 hover:bg-blue-500 active:bg-blue-600 text-white font-bold py-4 px-6 rounded-lg transition duration-200 transform hover:scale-105 active:scale-95 text-xl"
            >
                − 감소
            </button>

            <!-- 리셋 버튼 -->
            <button
                onclick="resetCounter()"
                class="w-full bg-gray-400 hover:bg-gray-500 active:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200 transform hover:scale-105 active:scale-95"
            >
                🔄 리셋
            </button>
        </div>

        <!-- 통계 정보 -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <p class="text-center text-gray-600 text-sm">
                버튼을 클릭해서 숫자를 변경해보세요!
            </p>
        </div>
    </div>

    <script>
        // 카운터 변수
        let count = 0;

        // 증가 함수
        function increaseCounter() {
            count++;
            updateDisplay();
        }

        // 감소 함수
        function decreaseCounter() {
            count--;
            updateDisplay();
        }

        // 리셋 함수
        function resetCounter() {
            count = 0;
            updateDisplay();
        }

        // 화면 업데이트 함수
        function updateDisplay() {
            document.getElementById('counter').textContent = count;
        }
    </script>
</body>
</html>
